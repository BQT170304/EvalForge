[project]
name = "evalforge"
version = "0.1.0"
description = "Production-grade AI/LLM/Agent Evaluation Service"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "EvalForge Team" }]
keywords = ["llm", "evaluation", "ai", "agents", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.0",
    # Task Queue
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    # Evaluation Engines
    "deepeval>=2.0.0",
    "ragas>=0.2.0",
    "litellm>=1.50.0",
    # NLP / Heuristic Metrics
    "nltk>=3.9.0",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "sentence-transformers>=3.3.0",
    # PII Detection
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    # Observability
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
    # HTTP Client (for adapters)
    "httpx>=0.27.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "jsonschema>=4.23.0",
    "python-multipart>=0.0.12",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-instrumentation-celery>=0.65b0",
    "opentelemetry-instrumentation-redis>=0.65b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalforge"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["evalforge"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
